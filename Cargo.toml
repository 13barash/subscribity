[package]
name = "subscribity"
version = "0.4.1"
edition = "2021"
description = "Tiny Windows tray app for tracking subscriptions"
license = "MIT"

[dependencies]
wry = { version = "0.47", default-features = false, features = ["os-webview", "protocol"] }
raw-window-handle = "0.6"
serde_json = "1"

[build-dependencies]
embed-resource = "2.5"

[dependencies.windows-sys]
version = "=0.59.0"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
